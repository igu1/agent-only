# The thin webhook GATEWAY (Phase 3 role): validate, resolve tenant,
# enqueue, answer Meta in milliseconds. Two replicas = zero-downtime rolling
# updates; safe because all shared state (queue, locks, webchat outbox)
# lives in Redis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cronoagent
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: cronoagent:v1.0        # same image as the workers
          envFrom:
            - configMapRef: { name: agent-env }
          volumeMounts:
            - name: tenants
              mountPath: /app/agent/tenants.json
              subPath: tenants.json
              readOnly: true
          ports: [{ containerPort: 8001 }]
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "768Mi" }
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tenants
          secret: { secretName: agent-tenants }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cronoagent
spec:
  selector: { app: gateway }
  ports: [{ port: 8001, targetPort: 8001 }]
