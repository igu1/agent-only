# Public HTTPS. One shared host can serve EVERY org: WhatsApp routes by the
# payload's phone_number_id, web chat by the /webhooks/{org}/... path.
# Add extra per-org hosts only if schools want branded agent domains.
# cert-manager (ClusterIssuer "letsencrypt") replaces certbot.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent
  namespace: cronoagent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [agent.example.com]
      secretName: agent-tls
  rules:
    - host: agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8001 }
