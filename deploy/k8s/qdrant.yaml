# Vector store - StatefulSet with a persistent volume. Rebuildable from SQL
# via Reindex, but persistence avoids re-embedding every tenant on restart.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: cronoagent
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports: [{ containerPort: 6333 }]
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "1Gi" }
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: cronoagent
spec:
  selector: { app: qdrant }
  ports: [{ port: 6333, targetPort: 6333 }]
