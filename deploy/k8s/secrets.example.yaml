# Copy to secrets.yaml (NEVER commit), fill real values, apply first.
# tenants.json carries ALL per-org identity (backend URLs, tokens, Gemini
# keys, Qdrant prefixes, WhatsApp phone_number_ids) - same file format as
# tenants.example.json in the repo root.
apiVersion: v1
kind: Secret
metadata:
  name: agent-tenants
  namespace: cronoagent
type: Opaque
stringData:
  tenants.json: |
    {
      "sanabl": {
        "backend_url": "https://api.sanabl.example.com",
        "api_token": "agw_generate_per_org",
        "google_api_key": "AIza_org_key",
        "qdrant_prefix": "sanabl",
        "phone_number_ids": ["1277267818798741"],
        "webchat_origins": ["https://sanabl.example.com"]
      }
    }
---
# Non-tenant runtime settings (model ids, embedder). No org secrets here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-env
  namespace: cronoagent
data:
  AI_MODEL: "google"
  GOOGLE_MODEL_ID: "gemini-3-flash-preview"
  AGNO_EMBEDDER: "google"
  REALTIME_MODE: "http"
  WEBCHAT_ALLOWED_ORIGINS: "*"
  PYTHONPATH: "/app/agent"
  QDRANT_URL: "http://qdrant:6333"
  TENANTS_FILE: "/app/agent/tenants.json"
  QUEUE_MODE: "redis"
  REDIS_URL: "redis://redis:6379/0"
