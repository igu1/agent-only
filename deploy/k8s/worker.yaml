# Chat WORKERS - the scaling dial. Same image, worker entrypoint; the HPA
# grows the pool on sustained CPU (admission-season spikes) and shrinks it
# at night. Liveness = the heartbeat file the worker loop touches.
#
# NOTE (from SAAS-ARCHITECTURE.md): before raising maxReplicas beyond ~3,
# move the agno chat memory from the shared sqlite volume to Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: cronoagent
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: cronoagent:v1.0
          command: ["python", "-u", "worker.py"]
          envFrom:
            - configMapRef: { name: agent-env }
          volumeMounts:
            - name: tenants
              mountPath: /app/agent/tenants.json
              subPath: tenants.json
              readOnly: true
            - name: agent-mem
              mountPath: /app/agent/mem
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits: { memory: "1Gi" }
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - '[ $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 120 ]'
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tenants
          secret: { secretName: agent-tenants }
        - name: agent-mem
          persistentVolumeClaim: { claimName: agent-mem }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-mem
  namespace: cronoagent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker
  namespace: cronoagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
