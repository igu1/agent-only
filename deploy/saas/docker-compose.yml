# ONE shared deployment serving every organization - the stack DEPLOYMENT.md
# describes. tenants.json lives NEXT TO this file
# and is volume-mounted: onboarding = edit the file + call
# POST /infra/reload-tenants - no rebuild, no restart.
#
# The .env here holds only NON-tenant settings (model ids, embedder, cache
# TTLs). All per-org identity (backend URLs, tokens, keys, prefixes) lives
# in tenants.json.
services:
  agent:
    # Both keys on purpose: `build` lets ONE command do everything -
    #   docker compose up -d --build
    # - while `image` keeps the result tagged, so the worker overlay and any
    # other compose file can reuse the same image instead of rebuilding it.
    # Without `build` this file can only PULL cronoagent:v1.0, which exists in
    # no registry, and `up` fails with a pull error that reads like a network
    # problem.
    #
    # The context is the repo root, two levels up, because that is where the
    # Dockerfile and .dockerignore live.
    build:
      context: ../..
      dockerfile: Dockerfile
    image: cronoagent:v1.0
    container_name: saas-agent
    restart: unless-stopped
    mem_limit: 1g
    ports:
      # ONE number inside and outside: AGENT_PORT from the .env next to this
      # file (default 5021). nginx-org.conf.template and onboard-org.sh use the
      # same value. Prefix with 127.0.0.1: to keep it off the public interface.
      - "${AGENT_PORT:-5021}:${AGENT_PORT:-5021}"
    env_file: [.env]
    environment:
      - PYTHONPATH=/app/agent
      - AGENT_PORT=${AGENT_PORT:-5021}
      - QDRANT_URL=http://qdrant:6333
      - TENANTS_FILE=/app/agent/tenants.json
    volumes:
      - ./tenants.json:/app/agent/tenants.json:ro
      - agent_logs:/app/agent/logs
      - agent_mem:/app/agent/mem
    depends_on: [qdrant]

  qdrant:
    image: qdrant/qdrant:latest
    container_name: saas-qdrant
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  agent_logs:
  agent_mem:
  qdrant_data:
