<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webchat test — CronoCRM Agent</title>
<style>
  :root { --bg:#f4f5f4; --card:#fff; --ink:#1a2622; --muted:#5d6b66; --accent:#0c6b58; --line:#e3e1da; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink);
         display:flex; justify-content:center; align-items:center; min-height:100vh; }
  .chat { width:min(420px,95vw); height:min(640px,92vh); background:var(--card); border:1px solid var(--line);
          border-radius:12px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  header { padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; }
  header small { display:block; font-weight:400; opacity:.85; font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:10px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:2px; }
  .ai { align-self:flex-start; background:var(--bg); border:1px solid var(--line); border-bottom-left-radius:2px; }
  .sys { align-self:center; color:var(--muted); font-size:12px; }
  #typing { display:none; align-self:flex-start; color:var(--muted); font-size:13px; padding:2px 12px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<div class="chat">
  <header>Sanabl Al International School
    <small>Admissions assistant — webchat channel test</small>
  </header>
  <div id="log"></div>
  <div id="typing">typing…</div>
  <form id="f">
    <input id="inp" placeholder="Type a message…" autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</div>
<script>
  // Point this at the agent service; channel 1 = webchat in tests/mock_backend.py
  const AGENT = 'http://localhost:8085';
  const CHANNEL = '1';

  const log = document.getElementById('log');
  const typing = document.getElementById('typing');
  const inp = document.getElementById('inp');
  let sessionId = localStorage.getItem('wc_session') || null;
  let afterId = 0;

  function add(kind, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + kind;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  async function ensureSession() {
    if (sessionId) return;
    const r = await fetch(`${AGENT}/webhooks/webchat/${CHANNEL}/session`, { method: 'POST' });
    const j = await r.json();
    sessionId = j.session_id;
    localStorage.setItem('wc_session', sessionId);
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    add('me', text);
    try {
      await ensureSession();
      await fetch(`${AGENT}/webhooks/webchat/${CHANNEL}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, text })
      });
    } catch (err) {
      add('sys', 'send failed: ' + err.message);
    }
  });

  async function poll() {
    if (sessionId) {
      try {
        const r = await fetch(`${AGENT}/webhooks/webchat/${CHANNEL}/messages?session_id=${sessionId}&after_id=${afterId}`);
        const j = await r.json();
        for (const m of (j.messages || [])) { add('ai', m.text); afterId = Math.max(afterId, m.id); }
        typing.style.display = j.typing ? 'block' : 'none';
      } catch (err) { /* agent down — keep polling */ }
    }
    setTimeout(poll, 1500);
  }

  add('sys', 'Session persists in localStorage — clear it to start a new conversation.');
  poll();
</script>
</body>
</html>
